name: CI

on:
  push:
    branches: [main]
    paths: ['qids-platform/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['qids-platform/**', '.github/workflows/ci.yml']

defaults:
  run:
    working-directory: qids-platform

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qids-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Engine smoke tests
        run: npm run test:engine

      # Advisory: fails only on critical vulns in production deps, and even
      # then doesn't block the pipeline (shown as an annotation for triage).
      - name: Dependency audit (non-blocking)
        run: npm audit --omit=dev --audit-level=critical || true

      # Playwright e2e smoke — public surfaces only (landing, auth, guards,
      # language switching). No project credentials needed, runs on every push.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npx playwright test

  # Authenticated school-loop e2e (teacher → class → assignment → student join
  # → start), run against the Firebase emulator instead of a live project: no
  # credentials, no secrets, no production data at risk. Java comes with
  # ubuntu-latest, which is all the Firestore emulator needs.
  #
  # Advisory (continue-on-error) until it has run green on a couple of pushes —
  # the emulator wiring has not been exercised in this environment. Drop the
  # flag once it is trusted; it then blocks like the other jobs.
  school-loop-e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qids-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: School loop e2e (emulator)
        run: npm run test:e2e:emulator
