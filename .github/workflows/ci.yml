name: CI

on:
  push:
    branches: [main]
    paths: ['qids-platform/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['qids-platform/**', '.github/workflows/ci.yml']

defaults:
  run:
    working-directory: qids-platform

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qids-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Engine smoke tests
        run: npm run test:engine

      # Playwright e2e smoke — public surfaces only (landing, auth, guards,
      # language switching). No project credentials needed, runs on every push.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npx playwright test
