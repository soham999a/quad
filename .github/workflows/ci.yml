name: CI

on:
  push:
    branches: [main]
    paths: ['qids-platform/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['qids-platform/**', '.github/workflows/ci.yml']

defaults:
  run:
    working-directory: qids-platform

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qids-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Engine smoke tests
        run: npm run test:engine

      # E2E needs Firebase/Groq env vars; run when present, skip PRs without them.
      - name: E2E smoke (optional)
        if: env.VITE_FIREBASE_API_KEY != ''
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          npm run dev -- --port 5173 --strictPort &
          npx wait-on http://localhost:5173 --timeout 30000
          npm run test:e2e:run || echo "::warning::E2E failed — non-blocking"
