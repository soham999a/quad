<html lang="en">
  <head>

    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d0f12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="QiDS" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QIDS — Quadrant Intelligence Development System</title>
    <meta name="description" content="Measure the four quotients — IQ, EQ, SQ and AQ — and turn results into grades, career profiles and development plans." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QIDS" />
    <meta property="og:title" content="QIDS — Quadrant Intelligence Development System" />
    <meta property="og:description" content="Measure the four quotients — IQ, EQ, SQ and AQ — and turn results into grades, career profiles and development plans." />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        { "@type": "Question", "name": "How long does the assessment take?", "acceptedAnswer": { "@type": "Answer", "text": "The core cycle takes about 20 minutes; the complete battery runs 40-60. Progress is checkpointed at every step - pause and resume exactly where you left off, on any device." } },
        { "@type": "Question", "name": "Is this a clinical diagnosis?", "acceptedAnswer": { "@type": "Answer", "text": "No. QiDS is a developmental instrument. It measures four capability quotients to inform learning and growth decisions - it is not a medical or psychological diagnostic device." } },
        { "@type": "Question", "name": "Who can see my results?", "acceptedAnswer": { "@type": "Answer", "text": "You do. A designated evaluator sees only what they need to score - nothing else. Publishing a public credential is opt-in." } },
        { "@type": "Question", "name": "What are the four quotients?", "acceptedAnswer": { "@type": "Answer", "text": "IQ (cognitive), EQ (emotional), SQ (social) and AQ (adaptive). They are read together as a shape rather than a single number." } },
        { "@type": "Question", "name": "What age range is supported?", "acceptedAnswer": { "@type": "Answer", "text": "Instruments are age-banded from 8 to 60 - child through professional - so the same architecture serves classrooms and hiring panels alike." } },
        { "@type": "Question", "name": "How much does it cost?", "acceptedAnswer": { "@type": "Answer", "text": "The core assessment is free. Pro and Institution tiers are in active development." } }
      ]
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the saved/OS theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('qids-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
