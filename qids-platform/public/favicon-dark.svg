<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <!-- QiDS favicon — animated (dark scheme): the gold cube travels the four
       quadrants TR → TL → BL → BR, one hop per 4.2s (16.8s ring), matching
       QidsMark. Cross-hairlines brighten at each center crossing. Pure SMIL. -->
  <rect width="28" height="28" fill="#0A0A0F"/>
  <rect x="1" y="1" width="26" height="26" fill="none" stroke="#EBC073" stroke-width="1.5"/>
  <line x1="14" y1="1" x2="14" y2="27" stroke="#EBC073" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5;1;0.5;1;0.5;1;0.5" keyTimes="0;0.1429;0.25;0.3929;0.5;0.6429;0.75;0.8929;1" dur="16.8s" repeatCount="indefinite"/>
  </line>
  <line x1="1" y1="14" x2="27" y2="14" stroke="#EBC073" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5;1;0.5;1;0.5;1;0.5" keyTimes="0;0.1429;0.25;0.3929;0.5;0.6429;0.75;0.8929;1" dur="16.8s" repeatCount="indefinite"/>
  </line>
  <rect x="0" y="0" width="11" height="11" fill="#EBC073">
    <animateTransform attributeName="transform" type="translate"
      values="15 2;15 2;2 2;2 2;2 15;2 15;15 15;15 15;15 2;15 2"
      keyTimes="0;0.0833;0.2024;0.3333;0.4524;0.5833;0.7024;0.8333;0.9524;1"
